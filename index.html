<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TACDRI</title>

  <!-- CSS e JS -->
  <link rel="stylesheet" href="index.css" />
  <script defer src="index.js"></script>

  <!-- Cor do navegador em mobile -->
  <meta name="theme-color" content="#0f3d25" />
</head>

<body>
  <header class="app-header">
    <h1>⚡ Calculadoras Nutricionais</h1>
    <p class="subtitle">Vitaminas • Minerais • Índices e Metabolismo</p>
  </header>

  <main class="container">

    <!-- Saturação de Ferro -->
    <section class="card">
      <fieldset>
        <legend>Índice de Saturação de Transferrina</legend>

        <label for="ferroSerico">Ferro sérico (µg/dL)</label>
        <input type="number" id="ferroSerico" placeholder="Ex: 80" inputmode="decimal" />

        <label for="TIBC">TIBC (µg/dL)</label>
        <input type="number" id="TIBC" placeholder="Ex: 320" inputmode="decimal" />

        <button id="btnTransferrina">🔍 Calcular</button>
        <output class="resultado" id="resTransferrina"></output>
      </fieldset>
    </section>

    <!-- IMC -->
    <section class="card">
      <fieldset>
        <legend>IMC — Índice de Massa Corporal</legend>

        <label for="pesoIMC">Peso (kg)</label>
        <input type="number" id="pesoIMC" placeholder="Ex: 70" inputmode="decimal" />

        <label for="alturaIMC">Altura (m)</label>
        <input type="number" id="alturaIMC" step="0.01" placeholder="Ex: 1.70" inputmode="decimal" />

        <button id="btnIMC">⚖️ Calcular</button>
        <output class="resultado" id="resIMC"></output>
      </fieldset>
    </section>

    <!-- MET -->
    <section class="card">
      <fieldset>
        <legend>Gasto Energético (MET)</legend>

        <label for="pesoMET">Peso (kg)</label>
        <input type="number" id="pesoMET" placeholder="Ex: 70" inputmode="decimal" />

        <label for="tempoAtv">Tempo de Atividade (min)</label>
        <input type="number" id="tempoAtv" placeholder="Ex: 30" inputmode="numeric" />

        <label for="valorMET">MET</label>
        <input type="number" id="valorMET" placeholder="Ex: 5" inputmode="decimal" />

        <button id="btnMET">🔥 Calcular</button>
        <output class="resultado" id="resMET"></output>
      </fieldset>
    </section>

    <!-- GET -->
    <section class="card">
      <fieldset>
        <legend>GET — Gasto Energético Total</legend>

        <label for="GEB">GEB</label>
        <input type="number" id="GEB" placeholder="Ex: 1500" inputmode="decimal" />

        <label for="FAtividade">Fator Atividade</label>
        <input type="number" id="FAtividade" placeholder="Ex: 1.3" inputmode="decimal" />

        <label for="FEstresse">Fator Estresse</label>
        <input type="number" id="FEstresse" placeholder="Ex: 1.1" inputmode="decimal" />

        <label for="FTermico">Fator Térmico</label>
        <input type="number" id="FTermico" placeholder="Ex: 1.1" inputmode="decimal" />

        <button id="btnGET">⚡ Calcular</button>
        <output class="resultado" id="resGET"></output>
      </fieldset>
    </section>

    <!-- Balanço Nitrogenado -->
    <section class="card">
      <fieldset>
        <legend>Balanço Nitrogenado</legend>

        <label for="nitIng">Nitrogênio Ingerido</label>
        <input type="number" id="nitIng" placeholder="Ex: 16" inputmode="decimal" />

        <label for="nitExc">Nitrogênio Excretado</label>
        <input type="number" id="nitExc" placeholder="Ex: 14" inputmode="decimal" />

        <button id="btnBN">🧪 Calcular</button>
        <output class="resultado" id="resBN"></output>
      </fieldset>
    </section>

    <!-- Nutrientes -->
    <section class="card">
      <fieldset>
        <legend>Cálculo de Nutrientes (TACO)</legend>

        <label for="nomeAlimento">Alimento</label>
        <input type="text" id="nomeAlimento" placeholder="Ex: Leite integral" autocomplete="off" />

        <label for="quantidadeAlimento">Quantidade (g)</label>
        <input type="number" id="quantidadeAlimento" placeholder="100" inputmode="numeric" />

        <div class="btn-group">
          <button id="btnAddConsumo">➕ Adicionar alimento</button>
          <button id="btnCalcularNutrientes">📊 Calcular Totais</button>
        </div>

        <output class="resultado" id="resNutrientes"></output>
      </fieldset>
    </section>

  </main>

  <footer class="app-footer">
    <p>© 2025 — Calculadoras Nutricionais</p>
  </footer>
</body>
</html>
